; MaTouchSonos – PlatformIO-Konfiguration
;
; Umgebungen:
;   matouch         Fernbedienung für das MaTouch ESP32-S3 Rotary 2.1" (ST7701)
;                   pio run -e matouch -t upload     bauen + flashen
;                   pio device monitor -e matouch    serielles Log
;   matouch_hwtest  Hardware-Testbildschirm (Schritt 0): Display, Touch, Drehring, Taste
;                   pio run -e matouch_hwtest -t upload
;   native          Unit-Tests der hardwareunabhängigen Logik auf dem PC
;                   pio test -e native

[platformio]
default_envs = matouch

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:matouch]
; Plattform und Bibliotheken bewusst fest gepinnt: Die Display-Ansteuerung
; (Arduino_GFX 1.3.8) ist mit dem Arduino-ESP32-Core 2.0.x erprobt.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi        ; 16 MB QIO-Flash + 8 MB OPI-PSRAM
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    moononournation/GFX Library for Arduino@1.3.8
    lvgl/lvgl@8.3.11

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1                ; natives USB (USB-Serial/JTAG)
    -DARDUINO_USB_CDC_ON_BOOT=1         ; Serial = USB-C-Port
    -DLV_CONF_INCLUDE_SIMPLE            ; lv_conf.h aus include/ verwenden
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
    -DMTS_SHOW_PERF=0                   ; FPS-Anzeige aus

[env:matouch_hwtest]
extends = env:matouch
build_flags =
    ${env:matouch.build_flags}
    -DMTS_HWTEST=1
    -UMTS_SHOW_PERF
    -DMTS_SHOW_PERF=1                   ; FPS-Anzeige für den Hardware-Test

[env:native]
platform = native
test_framework = unity
lib_ignore =
    hal
    net
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
